# ClipForge Bot site: Telegram Mini App static files and the API proxy for
# clipforge.thetirtayasa.my.id. Its own server blocks, so other sites on this Nginx are untouched.
# Get the certificate first (deploy/README.md section 15), then:
#   sudo cp deploy/nginx/clipforge-bot.conf /etc/nginx/sites-available/clipforge-bot.conf
#   sudo ln -s /etc/nginx/sites-available/clipforge-bot.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name clipforge.thetirtayasa.my.id;

    # Certificate renewals still pass: certbot's nginx plugin adds a temporary exact-match
    # location for its challenge, which takes precedence over this redirect.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` instead of `http2 on;` so it also works on Nginx < 1.25 (Ubuntu 22.04/24.04).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clipforge.thetirtayasa.my.id;

    ssl_certificate /etc/letsencrypt/live/clipforge.thetirtayasa.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clipforge.thetirtayasa.my.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:clipforge_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/clipforge-bot;
    index index.html;

    # Uploads arrive in chunks of at most 8 MiB (ADR-017).
    client_max_body_size 10m;

    server_tokens off;
    # Every response, the API included. Locations must not use add_header: Nginx would then drop
    # these. No X-Frame-Options: Telegram Web shows Mini Apps inside an iframe.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Vite content-hashes these file names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        # index.html names the current asset hashes; never serve a stale one after a deploy.
        # `expires -1` sends "Cache-Control: no-cache".
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
