# ClipForge Bot: Mini App static files and API proxy (spec, "Existing Nginx integration").
# Include inside the existing HTTPS `server { ... }` block; its listen/TLS directives stay as they are:
#   sudo cp deploy/nginx/clipforge-bot.conf /etc/nginx/snippets/clipforge-bot.conf
#   include /etc/nginx/snippets/clipforge-bot.conf;
# Then: sudo nginx -t && sudo systemctl reload nginx

root /var/www/clipforge-bot;
index index.html;

location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
}

# Vite content-hashes these file names, so they can be cached forever.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location / {
    # index.html names the current asset hashes; never serve a stale one after a deploy.
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}

# Uploads arrive in chunks of at most 8 MiB (ADR-017).
client_max_body_size 10m;
